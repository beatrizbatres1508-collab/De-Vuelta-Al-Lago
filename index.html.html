const MusicBox = (() => {
  let ctx = null;
  let enabled = true;
  let timer = null;
  let step = 0;

  const notes = [
    261.63, 329.63, 392.00, 329.63,
    293.66, 349.23, 440.00, 349.23,
    261.63, 329.63, 392.00, 329.63,
    220.00, 261.63, 329.63, 261.63
  ];

  function init() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      ctx = new AudioCtx();
    }
    if (ctx.state === "suspended") ctx.resume();
    if (!timer) timer = setInterval(playNext, 450);
  }

  function playNext() {
    if (!enabled || !ctx || ctx.state !== "running") return;
    const freq = notes[step % notes.length];
    step++;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.045, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.45);
  }

  function toggle() {
    enabled = !enabled;
    if (enabled) init();
    return enabled;
  }
  return { init, toggle };
})();

function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawSprite(grid, palette, x, y, scale = 2, flipX = false) {
  const rows = grid.length;
  const cols = grid[0].length;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (flipX) {
    ctx.scale(-1, 1);
  }
  const offsetX = -Math.floor((cols * scale) / 2);
  const offsetY = -Math.floor((rows * scale) / 2);

  for (let r = 0; r < rows; r++) {
    const row = grid[r];
    for (let c = 0; c < cols; c++) {
      const ch = row[c];
      if (ch !== "." && palette[ch]) {
        ctx.fillStyle = palette[ch];
        ctx.fillRect(offsetX + c * scale, offsetY + r * scale, scale, scale);
      }
    }
  }
  ctx.restore();
}

function drawHeartCanvas(x, y, size = 14, color = "#ff758f") {
  px(x - size * 0.45, y - size * 0.3, size * 0.4, size * 0.35, color);
  px(x + size * 0.05, y - size * 0.3, size * 0.4, size * 0.35, color);
  px(x - size * 0.5, y - size * 0.1, size, size * 0.4, color);
  px(x - size * 0.3, y + size * 0.3, size * 0.6, size * 0.25, color);
  px(x - size * 0.1, y + size * 0.55, size * 0.2, size * 0.15, color);
}

function updateHudHearts() {

}

function drawOtter(x, y, facing = 1, invuln = 0, moving = false) {
  if (invuln > 0 && Math.floor(frameCount / 4) % 2 === 0) return;

function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  let curY = y;
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + " ";
    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
      ctx.fillText(line.trim(), x, curY);
      line = words[n] + " ";
      curY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, curY);
}

const joystickZone = document.getElementById("joystick-zone");
const joystickStick = document.getElementById("joystick-stick");
let activeJoystickPointerId = null;

function updateJoystickFromClientPoint(clientX, clientY) {
  const rect = joystickZone.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const maxRadius = rect.width * 0.34;

  let dx = clientX - centerX;
  let dy = clientY - centerY;
  const dist = Math.hypot(dx, dy);

  if (dist > maxRadius && dist > 0) {
    dx = (dx / dist) * maxRadius;
    dy = (dy / dist) * maxRadius;
  }

  joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;

  const normX = dx / maxRadius;
  if (Math.abs(normX) < 0.18) {
    joystickAnalogX = 0;
    keys.left = false;
    keys.right = false;
  } else {
    joystickAnalogX = normX;
    keys.left = normX < -0.18;
    keys.right = normX > 0.18;
  }
}

function resetJoystick() {
  activeJoystickPointerId = null;
  joystickAnalogX = 0;
  keys.left = false;
  keys.right = false;
  joystickStick.style.transform = "translate(0px, 0px)";
}

joystickZone.addEventListener("pointerdown", e => {
  e.preventDefault();
  MusicBox.init();
  activeJoystickPointerId = e.pointerId;
  joystickZone.setPointerCapture(e.pointerId);
  updateJoystickFromClientPoint(e.clientX, e.clientY);
});

joystickZone.addEventListener("pointermove", e => {
  if (e.pointerId !== activeJoystickPointerId) return;
  e.preventDefault();
  updateJoystickFromClientPoint(e.clientX, e.clientY);
});

joystickZone.addEventListener("pointerup", e => {
  if (e.pointerId === activeJoystickPointerId) resetJoystick();
});
joystickZone.addEventListener("pointercancel", e => {
  if (e.pointerId === activeJoystickPointerId) resetJoystick();
});

function bindActionButton(id, keyName) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    MusicBox.init();
    keys[keyName] = true;
    el.classList.add("pressed");
  });
  const release = e => {
    if (keys[keyName]) {
      keys[keyName] = false;
      el.classList.remove("pressed");
    }
  };
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
  el.addEventListener("pointerleave", release);
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function damagePlayer() {
  if (player.invuln > 0) return;
  hearts--;
  updateHudHearts();
  player.invuln = 60;
  player.vy = -7;
  if (hearts <= 0) {
    loadLevel(currentLevel);
    hearts = CONFIG_JUEGO.vidas;
    updateHudHearts();
  }
}

function updateLevel() {
  if (player.invuln > 0) player.invuln--;

  if (Math.abs(joystickAnalogX) > 0.18) {
    player.vx = joystickAnalogX * player.speed;
    player.facing = joystickAnalogX < 0 ? -1 : 1;
  } else if (keys.left) {
    player.vx = -player.speed;
    player.facing = -1;
  } else if (keys.right) {
    player.vx = player.speed;
    player.facing = 1;
  } else {
    player.vx *= 0.75;
  }

  if (keys.up && player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }

  player.vy += 0.55;
  if (player.vy > 12) player.vy = 12;

  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > levelWidth) player.x = levelWidth - player.w;

  const plats = [...platforms];
  if (currentLevel === 2 && bridgeState.built) {
    plats.push({ x: bridgeState.x, y: bridgeState.y, w: bridgeState.w, h: 20, type: "bridge" });
  }

  for (let p of plats) {
    if (rectsOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  }

  player.y += player.vy;
  player.grounded = false;

  for (let p of plats) {
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.grounded = true; }
      else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
    }
  }

  if (player.y > canvas.height + 30) {
    damagePlayer();
    player.x = Math.max(40, player.x - 140);
    player.y = 150;
    player.vy = 0;
  }

  for (let c of collectibles) {
    if (!c.collected && rectsOverlap(player, c)) c.collected = true;
  }

  if (currentLevel === 2 && !bridgeState.built) {
    const got = collectibles.filter(c => c.collected).length;
    if (got === collectibles.length && Math.abs((player.x + player.w) - bridgeState.x) < 75 && keys.action) {
      bridgeState.built = true;
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x += e.vx;
    if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;
    if (rectsOverlap(player, e)) {
      if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 16) {
        e.hp--;
        player.vy = -9;
        if (e.hp <= 0) enemies.splice(i, 1);
      } else {
        damagePlayer();
      }
    }
  }

  if (boss && boss.hp > 0) {
    boss.timer++;
    if (boss.timer % 110 === 0) {
      boss.activeAttack = true;
      boss.rootAttackX = boss.x;
    }
    if (boss.activeAttack) {
      boss.rootAttackX -= 4.5;
      if (rectsOverlap(player, { x: boss.rootAttackX, y: 325, w: 36, h: 25 })) {
        damagePlayer();
        boss.activeAttack = false;
      }
      if (boss.rootAttackX < boss.x - 360) boss.activeAttack = false;
    }
    if (rectsOverlap(player, boss)) {
      if (player.vy > 0 && player.y + player.h - player.vy <= boss.y + 30) {
        boss.hp--;
        player.vy = -10;
      } else {
        damagePlayer();
      }
    }
  }

  cameraX = player.x - canvas.width * 0.35;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;

  const info = nivelesInfo[currentLevel];
  let done = false;
  if (currentLevel === 0) { hudTask.textContent = `${info.hud}${enemies.length}`; done = enemies.length === 0; }
  else if (currentLevel === 1) { const hp = boss ? boss.hp : 0; hudTask.textContent = `${info.hud}${hp}`; done = hp === 0; }
  else if (currentLevel === 2) { const g = collectibles.filter(c => c.collected).length; hudTask.textContent = bridgeState.built ? "PUENTE LISTO" : `${info.hud}${g}/7`; done = bridgeState.built; }
  else if (currentLevel === 3) { hudTask.textContent = `${info.hud}${enemies.length}`; done = enemies.length === 0; }
  else { const g = collectibles.filter(c => c.collected).length; hudTask.textContent = `${info.hud}${g}/7 | BICHOS:${enemies.length}`; done = g === 7 && enemies.length === 0; }

  hudLevel.textContent = `NIVEL ${currentLevel + 1} - VOLVIENDO AL LAGO`;

  if (done && rectsOverlap(player, goal)) {
    if (currentLevel < 4) startBetweenLevels(currentLevel + 1);
    else startMinigameHair();
  }
}

function drawLevel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const w = canvas.width, h = canvas.height;
  const pSlow = -(cameraX * 0.2) % w;

  if (currentLevel === 0) {
    px(0, 0, w, 345, "#bfe3f7");
    px(0, 120, w, 120, "#f7d6bf");
    px(0, 345, w, 105, "#8ecae6");
    for (let i = 0; i < 20; i++) {
      px(((i * 60 + frameCount * 2) % (w + 50)) - 25, 365 + (i % 3) * 22, 24, 4, "#ffffff");
    }
  } else if (currentLevel === 1) {
    px(0, 0, w, 350, "#251e3e");
    px(640, 55, 48, 48, "#fff1c9");
    for (let i = 0; i < 18; i++) {
      px(((i * 80 + frameCount * 0.5) % w), 75 + ((i * 39 + Math.sin(frameCount * 0.05 + i) * 12) % 220), 4, 4, "#ffd6a5");
    }
  } else if (currentLevel === 2) {
    px(0, 0, w, 180, "#a9d6e5");
    px(0, 180, w, 170, "#e2eafc");
    px(0, 350, w, 100, "#3a405a");
    for (let i = 0; i < 12; i++) {
      px(((i * 85 - cameraX * 0.1) % w + w) % w, 75 + (i % 3) * 25, 48, 12, "rgba(255,255,255,0.65)");
    }
  } else if (currentLevel === 3) {
    px(0, 0, w, h, "#281b3b");
    px(0, 120, w, 230, "#382452");
    for (let r = -1; r <= 1; r++) {
      for (let cx = 40; cx < w; cx += 100) {
        px(r * w + pSlow + cx, 36, 22, 34, "#4d194c");
        px(r * w + pSlow + cx + 5, 70, 12, 18, "#e5b8eb");
      }
    }
  } else {
    drawLakeScenery(false);
  }

  ctx.save();
  ctx.translate(-Math.round(cameraX), 0);

  for (let p of platforms) {
    px(p.x - 2, p.y - 2, p.w + 4, p.h + 4, "#231a2c");
    if (p.type === "grass") {
      px(p.x, p.y, p.w, p.h, "#b5804e");
      px(p.x, p.y, p.w, 10, "#9bc47d");
      px(p.x, p.y + 10, p.w, 3, "#7aa35d");
    } else if (p.type === "log") {
      px(p.x, p.y, p.w, p.h, "#d49b63");
      px(p.x, p.y + p.h - 6, p.w, 6, "#9c6644");
    } else if (p.type === "night") {
      px(p.x, p.y, p.w, p.h, "#352b54");
      px(p.x, p.y, p.w, 10, "#52b788");
    } else {
      px(p.x, p.y, p.w, p.h, "#4d194c");
      px(p.x, p.y, p.w, 8, "#e5b8eb");
    }
  }

  if (currentLevel === 2) {
    if (bridgeState.built) {
      for (let bx = bridgeState.x; bx < bridgeState.x + bridgeState.w - 6; bx += 24) {
        px(bx - 2, bridgeState.y - 2, 22, 16, "#231a2c");
        px(bx, bridgeState.y, 18, 12, "#fae5c3");
      }
    } else {
      ctx.strokeStyle = "#ffd6a5";
      ctx.setLineDash([6, 6]);
      ctx.strokeRect(bridgeState.x, bridgeState.y, bridgeState.w, 16);
      ctx.setLineDash([]);
    }
  }

  for (let c of collectibles) {
    if (c.collected) continue;
    const bob = Math.sin(frameCount * 0.1 + c.x * 0.02) * 3;
    if (c.type === "plank") {
      px(c.x - 2, c.y - 2 + bob, c.w + 4, 14, "#231a2c");
      px(c.x, c.y + bob, c.w, 10, "#fae5c3");
      px(c.x + 4, c.y + 2 + bob, 3, 3, "#9c6644");
      px(c.x + 17, c.y + 2 + bob, 3, 3, "#9c6644");
    } else {
      px(c.x + 8, c.y + 10 + bob, 6, 12, "#231a2c");
      px(c.x + 9, c.y + 11 + bob, 4, 10, "#74c69d");
      px(c.x + 2, c.y + bob, 18, 16, "#231a2c");
      px(c.x + 4, c.y + 2 + bob, 14, 12, c.color);
      px(c.x + 8, c.y + 5 + bob, 6, 6, "#fff8f0");
    }
  }

  for (let e of enemies) {
    const flip = e.vx < 0;
    const cx = e.x + e.w / 2;
    const cy = e.y + e.h / 2;
    if (e.type === "fish") {
      drawSprite(SPRITE_FISH_ENEMY, PAL, cx, cy, 2.2, flip);
    } else if (e.type === "crystal") {
      drawSprite(SPRITE_CRYSTAL_ENEMY, PAL, cx, cy, 2.2, flip);
    } else {
      drawSprite(SPRITE_BUG_ENEMY, PAL, cx, cy, 2.1, flip);
    }
  }

  if (boss && boss.hp > 0) {
    drawSprite(SPRITE_BOSS_TREE, PAL, boss.x + boss.w / 2, boss.y + boss.h / 2, 4.5, false);
    if (boss.activeAttack) {
      px(boss.rootAttackX - 2, 324, 40, 28, "#231a2c");
      px(boss.rootAttackX, 326, 36, 24, "#7f4f24");
      px(boss.rootAttackX + 6, 320, 8, 8, "#588157");
    }
  }

  px(goal.x + 16, goal.y - 2, 8, goal.h + 4, "#231a2c");
  px(goal.x + 18, goal.y, 4, goal.h, "#fff8f0");
  drawHeartCanvas(goal.x + 20, goal.y + 14, 22, "#ff758f");

  drawOtter(player.x + 18, player.y + 14, player.facing, player.invuln, Math.abs(player.vx) > 0.3);
  ctx.restore();
}

btnStart.addEventListener("click", () => {
  MusicBox.init();
  startComicIntro();
});

function loop() {
  frameCount++;
  if (state === "COMIC_INTRO") drawComicIntro();
  else if (state === "PLAYING") { updateLevel(); drawLevel(); }
  else if (state === "BETWEEN_LEVELS") drawBetweenLevels();
  else if (state === "ENDING_ANIM") drawEndingAnimation();
  requestAnimationFrame(loop);
}
loop();
